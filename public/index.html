<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a12"><meta name="description" content="Field observations, carefully recorded."><title>Field Notebook</title><link rel="stylesheet" href="/assets/notebook.css"><script type="module" src="/assets/notebook.js"></script>
	</head>
	<body>
		<div class="shell"><aside><a class="brand" href="/"><span>FN</span><b>Field<br>Notebook</b></a><nav><a class="active" href="#observations">Observations</a><a href="#conditions">Conditions</a><a href="#locations">Locations</a></nav><blockquote>“Attention is the beginning of devotion.”<cite>— Mary Oliver</cite></blockquote></aside><main><header><div><p class="date"></p><h1>Observations</h1></div><button class="add">Record finding</button></header><section class="summary"><article><span>Recorded</span><strong id="total">—</strong></article><article><span>Need attention</span><strong id="watch">—</strong></article><article class="weather"><span>Field conditions</span><strong>Dry · 18°</strong></article></section><section class="toolbar"><div class="filters"><button class="selected" data-filter="all">All</button><button data-filter="flora">Flora</button><button data-filter="fauna">Fauna</button><button data-filter="weather">Weather</button><button data-filter="terrain">Terrain</button></div><label>Search <input id="search" type="search" placeholder="Search notes"></label></section><section class="entries"></section></main></div>
		<dialog><form id="entry-form" method="dialog"><header><h2>Record an observation</h2><button value="cancel">×</button></header><label>Title<input name="title" required maxlength="120"></label><div class="row"><label>Location<input name="location" required maxlength="100"></label><label>Category<select name="category"><option>flora</option><option>fauna</option><option>weather</option><option>terrain</option></select></label></div><div class="row"><label>Condition<select name="condition"><option>stable</option><option>watch</option><option>critical</option></select></label><label>Temperature °C<input name="temperature" type="number" min="-80" max="80" step="0.1"></label></div><label>Field notes<textarea name="notes" rows="5" maxlength="1200"></textarea></label><footer><button value="cancel">Cancel</button><button class="save" value="default">Save observation</button></footer></form></dialog>
	</body>
</html>
